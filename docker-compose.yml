version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cleantrack-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=cleantrack_super_secure_jwt_secret_key_2026
      - DATABASE_URL=sqlite:////app/data/cleantrack.db
      - UPLOAD_DIR=/app/uploads
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_data:/app/data       # SQLite database persisted here
      - backend_uploads:/app/uploads # Uploaded images persisted here
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React Frontend ───────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cleantrack-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
